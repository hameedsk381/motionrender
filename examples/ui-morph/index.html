<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>One shape</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeece7;font-family:Geist,"Segoe UI",sans-serif;overflow:hidden}svg{display:block;width:min(100vw,100vh);height:min(100vw,100vh);margin:auto}text{dominant-baseline:middle;font-weight:600;letter-spacing:-.035em}
</style>
<svg viewBox="0 0 1440 1440" aria-label="One continuous shape morphing through eleven interface states">
<defs><filter id="blur"><feGaussianBlur id="sigma"/></filter></defs>
<g id="camera"><rect id="shell" stroke="#181818" stroke-width="2"/><rect id="indicator"/><g id="content" filter="url(#blur)"></g><path id="pointer" d="M0 0L5 39L15 27L29 27Z" fill="#171717" stroke="white" stroke-width="3" stroke-linejoin="round"/></g>
</svg>
<script>
const el=id=>document.getElementById(id);
const clamp=x=>Math.min(1,Math.max(0,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
// Critically damped step, with a smooth finite tail for exact loop endpoints.
function spring(t,d=.43){
  const x=clamp(t/d), u=8*x;
  return 1-(1+u)*Math.exp(-u)*(1-smooth((x-.74)/.26));
}
// Beat, width, height, radius, luminance, camera scale.
const poses=[
 [0,390,122,61,22,1.9],[1,148,148,74,22,2.45],[3,148,148,74,255,2.45],
 [4,382,105,53,22,1.8],[6,660,312,42,22,1.35],[10,680,136,68,255,1.4],
 [13,262,126,63,22,2.1],[15,660,124,62,255,1.4],[18,760,450,48,255,1.24],
 [21,730,351,40,22,1.25],[24,660,146,40,255,1.38],[26,390,122,61,22,1.9]
];
const cursor=[
 [0,174,108],[1,74,4],[2,154,101],[4,164,82],[5,116,0],[6,170,75],
 [7,-236,80],[8,-141,81],[9,146,81],[10,146,81],[11,146,0],[12,365,0],
 [13,233,95],[14,-62,0],[15,90,88],[16,-6,0],[17,96,0],[18,138,96],
 [20,144,-3],[20.84,144,-3],[21,216,141],[23,160,90],[24,240,95],[25,270,0],
 [26,296,140],[27,260,139],[27.88,174,108],[28,174,108]
];
const alternate=new URLSearchParams(location.search).get('recipe')==='settings';
if(alternate){
  cursor.find(k=>k[0]===9)[1]=52;
  cursor.find(k=>k[0]===10)[1]=52;
  cursor.find(k=>k[0]===11)[1]=52;
  cursor.find(k=>k[0]===16)[1]=204;
}
function point(b){
  const i=Math.max(1,cursor.findIndex(k=>k[0]>=b));
  const [a,x,y]=cursor[i-1], [z,u,v]=cursor[i];
  const f=smooth((b-a)/(z-a));
  return [x+(u-x)*f,y+(v-y)*f];
}
function dragValue(beat,{grab,release,rest}){
 const start=point(grab)[0];
 if(beat<grab)return start;
 if(beat<=release)return point(beat)[0];
 const end=point(release)[0];
 return rest===undefined?end:end+(rest-end)*spring((beat-release)/2);
}
const scrub={grab:8,release:9};
const volume={grab:11,release:12,rest:248};
function indicator(b){
 const handoff=spring((b-15)/2);
 const destination=alternate?105:-105;
 const leading=spring((b-16)/2,.41);
 const trailing=spring((b-16)/2-.065,.34);
 const toggleLeft=-109+122*spring((b-14)/2-.045,.34);
 const toggleRight=-17+122*spring((b-14)/2,.34);
 const left=toggleLeft+(-309-toggleLeft)*handoff+(destination+309)*trailing;
 const right=toggleRight+(-111-toggleRight)*handoff+(destination+309)*leading;
 const l=Math.round(255-232*handoff);
 return {x:left,y:-46+2*handoff,width:right-left,height:92-4*handoff,rx:46-2*handoff,
   opacity:spring((b-13)/2,.22)*smooth((18.16-b)/.16),fill:`rgb(${l} ${l} ${l})`};
}
const label=(x,y,s,size=44,anchor='start',fill='currentColor')=>
 `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}" fill="${fill}">${s}</text>`;
const box=(x,y,w,h,r,fill='currentColor')=>
 `<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${h}" rx="${r}" fill="${fill}"/>`;
const path=(d,extra='')=>`<path d="${d}" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const dot=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="currentColor"/>`;
const draw=(d,p)=>path(d,`pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-clamp(p)}"`);
function art(i,b,x){
 switch(i){
 case 0:case 11:return label(-108,1,'Start',51)+path('M66 0h39m-15 -15 15 15 -15 15');
 case 1:return `<circle r="32" fill="none" stroke="#555" stroke-width="5"/><circle r="32" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="${28+65*smooth((b-1)/1.9)} 100" transform="rotate(${-90+(b-1)*250})"/>`;
 case 2:return draw('M-27 0l17 17 38-37',(b-3)*2.4);
 case 3:return dot(-139,0,8)+label(-112,1,'Now playing',33)+[13,24,34,19,28].map((h,j)=>{const y=h*(.72+.28*Math.sin(b*8+j));return box(82+j*13,-y/2,5,y,3)}).join('');
 case 4:{
  const p=spring((b-7)/2);
  const thumb=dragValue(b,scrub);
  return box(-279,-106,88,88,22,'#f4f4f4')+
    '<g color="#171717">'+path('M-250 -55v-20l27-8v23')+dot(-255,-53,7)+dot(-228,-58,7)+'</g>'+
    label(-167,-78,'One Shape',43)+label(-166,-34,'Original mix',24,'start','#ababab')+
    '<g transform="translate(-236 80)">'+
    `<path fill="white" d="M-9 -13 L${12-8*p} ${-13*p} L${12-8*p} ${13*p} L-9 13Z"/>`+
    box(10,-13,7*p,26,2)+'</g>'+
    box(-186,78,463,4,2,'#606060')+box(-186,78,thumb+186,4,2)+`<g id="playhead" data-x="${thumb}">`+dot(thumb,80,8)+'</g>'+
    label(-186,108,'0:'+String(Math.round((thumb+186)/463*14)).padStart(2,'0'),19)+label(277,108,'0:14',19,'end');
 }
 case 5:{
  const thumb=dragValue(b,volume);
  return path('M-290 -8h9l14-12v40l-14-12h-9Z M-256 -10q12 10 0 20')+
   box(-224,-4,Math.max(472,thumb+224),8,4,'#d4d4d4')+
   box(-224,-4,thumb+224,8,4)+dot(thumb,0,15);
 }
 case 6:return '';
 case 7:{
  const {x,width}=indicator(b);
  const ink=center=>center>=x+45&&center<=x+width-45?'#fff':'#171717';
  return label(-210,1,'Overview',31,'middle',ink(-210))+
    label(-6,1,'Activity',31,'middle',ink(-6))+label(204,1,'Settings',31,'middle',ink(204));
 }
 case 8:return label(-322,-153,'Activity',53)+label(322,-149,'LAST 7 DAYS',20,'end','#656565')+
   [-65,5,75,145].map(y=>box(-320,y,640,1,0,'#dadada')).join('')+
   draw('M-320 126 C-270 126 -242 70 -190 73 S-107 103 -58 61 S15 15 55 31 S108 44 144 -3 S226 36 319 -83',(b-18.7)/1.23)+
   label(-320,180,'MON',18)+label(320,180,'SUN',18,'end')+
   (b>=20?`<g opacity="${spring((b-20)/2,.15)}">`+dot(144,-3,9)+box(86,-89,116,56,13)+label(144,-60,'+24%',26,'middle','#fff')+'</g>':'');
 case 9:{
  const typed='exp'.slice(0,Math.floor(clamp((b-21.9)/.8)*3));
  return path('M-310 -99a12 12 0 1 1 24 0a12 12 0 1 1 -24 0m20 9 10 10')+
    label(-259,-94,typed||'Find an action…',37,'start',typed?'#fff':'#a5a5a5')+
    box(247,-117,69,45,12,'#323232')+label(282,-94,'⌘K',22,'middle')+
    box(-326,-53,652,1,0,'#474747')+
    box(-324,-29,648,71,18,b>=23?'#f4f4f4':'#343434')+
    label(-300,7,typed?'Export clip':'Open project',32,'start',b>=23?'#171717':'#fff')+
    label(292,7,'↵',32,'end',b>=23?'#171717':'#fff')+
    label(-300,91,typed?'Export settings':'Search actions',31,'start','#a5a5a5');
 }
 case 10:return dot(-264,0,31)+'<g color="white">'+path('M-276 0l8 8 16-17')+'</g>'+
   label(-210,-15,'Clip exported',39)+label(-209,30,'Ready to share',25,'start','#666')+
   path('M260 -10l20 20m0-20-20 20');
 }
}
window.seek=function seek(seconds){
 const b=((seconds%14+14)%14)*2;
 const values=poses[0].slice(1);
 let index=0;
 poses.slice(1).forEach((p,i)=>{
   const amount=spring((b-p[0])/2);
   for(let j=0;j<values.length;j++)values[j]+=(p[j+1]-poses[i][j+1])*amount;
   if(b>=p[0])index=i+1;
 });
 const [x,y]=point(b);
 const [w,h,r,l,z]=values;
 const stretch=Math.max(0,dragValue(b,volume)-248)*
   (index===5?spring((b-10)/2):1-spring((b-13)/2));
 const extra=b>=11&&b<14?stretch:0;
 const clicks=[1,5,7,8,11,14,16,25];
 const press=clicks.reduce((v,k)=>Math.max(v,Math.max(0,1-Math.abs(b-k)/.17)),0);
 el('camera').setAttribute('transform',`translate(720 720) scale(${z*(1-.015*press)})`);
 for(const [k,v] of Object.entries({x:-w/2,y:-h/2,width:w+extra,height:h,rx:r,fill:`rgb(${l} ${l} ${l})`}))el('shell').setAttribute(k,v);
 for(const [k,v] of Object.entries(indicator(b)))el('indicator').setAttribute(k,v);
 const age=(b-poses[index][0])/2;
 const remaining=index<11?(poses[index+1][0]-b)/2:1;
 const enter=index?spring((age-.07),.24):1;
 const alpha=Math.min(enter,smooth(remaining/.09));
 el('content').setAttribute('opacity',alpha);
 el('content').setAttribute('color',poses[index][4]>128?'#171717':'#fff');
 el('sigma').setAttribute('stdDeviation',alpha>.999?0:3.4*(1-alpha));
 el('content').innerHTML=art(index,b,x)||'';
 el('pointer').setAttribute('transform',`translate(${x} ${y}) scale(${1-.18*press})`);
};
seek(0);
</script>
</html>
